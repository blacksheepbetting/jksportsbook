                  - { label: Description, name: description, widget: text }
              - label: The Touchline
                name: theTouchline
                widget: object
                fields:
                  - { label: Display Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
          - label: Podcast
            name: podcast
            widget: object
            fields:
              - { label: Show Title, name: title, widget: string }
              - { label: Spotify URL, name: spotifyUrl, widget: string, required: false }
              - { label: Apple Podcasts URL, name: appleUrl, widget: string, required: false }
              - { label: YouTube Channel or Episode URL, name: youtubeUrl, widget: string, required: false }
              - label: Episodes
                name: episodes
                widget: list
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Label, name: number, widget: string }
                  - { label: Duration, name: duration, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: YouTube Embed URL, name: videoUrl, widget: string, required: false }
                  - { label: Thumbnail URL, name: thumbnailUrl, widget: string, required: false }
                  - { label: Listen URL, name: listenUrl, widget: string }
          - label: Edit Existing Stories
            name: storyOverrides
            widget: list
            summary: "{{fields.id}} — {{fields.title}}"
            hint: "Edit a story already in the newsroom by adding its existing Story ID here."
            fields:
              - { label: Story ID, name: id, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Deck, name: deck, widget: text }
              - { label: Author, name: author, widget: string }
              - { label: Read Time, name: readTime, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Content Type, name: type, widget: select, options: [story, column], default: story }
              - { label: Column Series, name: series, widget: select, options: [{ label: Not a column, value: "" }, { label: JK Sportsline, value: "jk-sportsline" }, { label: The Becker Report, value: "becker-report" }, { label: "Bossart's Board", value: "bossarts-board" }, { label: The Touchline, value: "the-touchline" }], required: false }
              - { label: Cover Photo, name: coverImage, widget: select, options: [{ label: Automatic by sport / topic, value: auto }, { label: Football - Black & White, value: football }, { label: Basketball - Black & White, value: basketball }, { label: Soccer - Black & White, value: soccer }, { label: Hockey - Black & White, value: hockey }, { label: Consumer Advocacy - Black & White, value: consumer-advocacy }, { label: Original Graphic Art, value: none }], default: auto, required: false }
              - { label: Body HTML, name: body, widget: markdown }
          - label: Articles & Match Analysis
            name: newStories
            widget: list
            summary: "{{fields.sport}} — {{fields.title}}"
            hint: "For Game of the Week analysis, add a story here and choose Game of the Week under Betting Page Feature. For recurring column articles, use the matching Weekly Columns collection."
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Sport, name: sport, widget: select, options: [NFL, NBA, College, MLB, Soccer, FPHL, All] }
              - { label: Category, name: category, widget: string }
              - { label: Betting Page Feature, name: deskSection, widget: select, options: [{ label: Not a betting feature, value: "" }, { label: Game of the Week, value: "game-of-week" }], required: false, hint: "Choose Game of the Week to place this article in the Betting page match analysis." }
              - { label: Type, name: type, widget: select, options: [story], default: story }
              - { label: Art Style, name: art, widget: select, options: [stadium, court, baseball, playbook], default: playbook }
              - { label: Cover Photo, name: coverImage, widget: select, options: [{ label: Automatic by sport / topic, value: auto }, { label: Football - Black & White, value: football }, { label: Basketball - Black & White, value: basketball }, { label: Soccer - Black & White, value: soccer }, { label: Hockey - Black & White, value: hockey }, { label: Consumer Advocacy - Black & White, value: consumer-advocacy }, { label: Original Graphic Art, value: none }], default: auto, required: false }
              - { label: Art Label, name: artLabel, widget: string, required: false }
              - { label: Deck, name: deck, widget: text }
              - { label: Author, name: author, widget: string }
              - { label: Read Time, name: readTime, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Story / Matchup Analysis, name: body, widget: markdown }
          - label: Sample Pick Breakdown Cards
            name: demoPicks
            widget: list
            summary: "{{fields.sport}} / {{fields.type}} — {{fields.matchup}}"
            hint: "These illustrative cards appear while the official picks board is empty. Edit the matchup, selection, odds, and analysis here; official picks are managed separately below."
            fields:
              - { label: Stable ID, name: id, widget: string, hint: "Leave the existing demo IDs in place." }
              - { label: Sport, name: sport, widget: select, options: [NFL, NBA, College, Soccer, FPHL, All] }
              - { label: Bet Type, name: type, widget: string }
              - { label: Matchup Heading, name: matchup, widget: string }
              - { label: Selection, name: selection, widget: string }
              - { label: American Odds, name: odds, widget: number, value_type: int }
              - { label: Units, name: units, widget: number, value_type: float }
              - { label: Short Note, name: note, widget: string, required: false, hint: "Shown only when the analysis field is blank." }
              - { label: Pick Analysis / Card Description, name: body, widget: text }
          - label: Official Best Bets & Analysis
            name: picks
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Sport, name: sport, widget: string }
              - { label: Type, name: type, widget: string }
              - { label: Matchup, name: matchup, widget: string }
              - { label: Selection, name: selection, widget: string }
              - { label: American Odds, name: odds, widget: number, value_type: int }
              - { label: Units, name: units, widget: number, value_type: float }
              - { label: Posted At, name: postedAt, widget: string, required: false }
              - { label: Pick Analysis / Reasoning, name: body, widget: text }
          - label: Articles
            name: articles
            widget: list
            summary: "{{fields.title}}"
            hint: "Add the newest article at the top. The list order controls how articles appear on the page."
            fields:
              - { label: Story ID, name: id, widget: string, hint: "Use a unique lowercase URL slug, such as jks-2026-11-12-season-preview." }
              - { label: Title, name: title, widget: string }
              - { label: Sport, name: sport, widget: select, options: [NFL, NBA, College, MLB, Soccer, FPHL, All] }
              - { label: Category, name: category, widget: string }
              - { label: Art Style, name: art, widget: select, options: [stadium, court, baseball, playbook], default: playbook }
              - { label: Cover Photo, name: coverImage, widget: select, options: [{ label: Automatic by sport / topic, value: auto }, { label: Football - Black & White, value: football }, { label: Basketball - Black & White, value: basketball }, { label: Soccer - Black & White, value: soccer }, { label: Hockey - Black & White, value: hockey }, { label: Consumer Advocacy - Black & White, value: consumer-advocacy }, { label: Original Graphic Art, value: none }], default: auto, required: false }
              - { label: Art Label, name: artLabel, widget: string, required: false }
              - { label: Deck, name: deck, widget: text }
              - { label: Author, name: author, widget: string }
              - { label: Read Time, name: readTime, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Article Body, name: body, widget: markdown }
