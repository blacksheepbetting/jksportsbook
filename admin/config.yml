                  - { label: All Columns Kicker, name: allColumnsKicker, widget: string }
                  - { label: All Columns Title, name: allColumnsTitle, widget: string }
                  - { label: Jk Sportsline Kicker, name: jkSportslineKicker, widget: string }
                  - { label: Becker Report Kicker, name: beckerReportKicker, widget: string }
                  - { label: "Bossart's Board Kicker", name: bossartsBoardKicker, widget: string }
                  - { label: The Touchline Kicker, name: theTouchlineKicker, widget: string }
                  - { label: Weekly Articles Kicker, name: seriesArticlesKicker, widget: string }
                  - { label: Weekly Articles Heading, name: seriesArticlesTitle, widget: string }
                  - { label: Shows Kicker, name: showsKicker, widget: string }
                  - { label: Shows Title, name: showsTitle, widget: string }
                  - { label: Shows Description, name: showsDescription, widget: string }
                  - { label: Show List Kicker, name: showListKicker, widget: string }
                  - { label: Watch / Listen Button, name: watchListen, widget: string }
                  - { label: Schedule Scoreboard Label, name: scheduleScoreboardLabel, widget: string }
                  - { label: Schedule Opening Label, name: scheduleOpeningLabel, widget: string }
                  - { label: Schedule Opening Message, name: scheduleOpeningMessage, widget: text }
                  - { label: Schedule Edition Label, name: scheduleOpeningEdition, widget: string }
                  - { label: Schedule Headline Line 1, name: scheduleTitleLine1, widget: string }
                  - { label: Schedule Headline Line 2, name: scheduleTitleLine2, widget: string }
                  - { label: Schedule Description, name: scheduleDescription, widget: text }
                  - { label: Schedule Source Label, name: scheduleSourceLabel, widget: string }
                  - { label: All Games Filter, name: scheduleAllGames, widget: string }
                  - { label: Upcoming Filter, name: scheduleUpcoming, widget: string }
                  - { label: Results Filter, name: scheduleResults, widget: string }
                  - { label: Lines Section Label, name: scheduleLinesKicker, widget: string }
                  - { label: Lines Section Heading, name: scheduleLinesTitle, widget: string }
                  - { label: Lines Section Description, name: scheduleLinesDescription, widget: text }
                  - { label: Best Bets Link Text, name: scheduleBestBetsLink, widget: string }
                  - { label: Betting Page Label, name: bettingKicker, widget: string }
                  - { label: Betting Page Heading, name: bettingTitle, widget: string }
                  - { label: Betting Page Description, name: bettingDescription, widget: text }
                  - { label: Best Bets Kicker, name: bestBetsKicker, widget: string }
                  - { label: Best Bets Title, name: bestBetsTitle, widget: string }
                  - { label: Best Bets Aside, name: bestBetsAside, widget: string }
                  - { label: Pick Breakdowns - Section Label, name: picksKicker, widget: string }
                  - { label: Pick Breakdowns - Heading, name: picksTitle, widget: string }
                  - { label: Pick Breakdowns - Calculator Link, name: picksLink, widget: string }
                  - { label: Game of the Week Section Label, name: gameKicker, widget: string }
                  - { label: Game of the Week Heading, name: gameTitle, widget: string }
                  - { label: Game of the Week Introduction, name: gameDescription, widget: text }
                  - { label: Fphl Kicker, name: fphlKicker, widget: string }
                  - { label: Fphl Title, name: fphlTitle, widget: string }
                  - { label: Fphl Description, name: fphlDescription, widget: string }
                  - { label: Fphl Section Kicker, name: fphlSectionKicker, widget: string }
                  - { label: Fphl Section Title, name: fphlSectionTitle, widget: string }
                  - { label: No Stories, name: noStories, widget: string }
                  - { label: No Episodes, name: noEpisodes, widget: string }
                  - { label: No Bets, name: noBets, widget: string }
                  - { label: No Picks, name: noPicks, widget: string }
                  - { label: Betting Page - Disclaimer, name: bettingDisclaimer, widget: text }
              - label: Odds Calculator
                name: calculator
                widget: object
                fields:
                  - { label: Section Label, name: kicker, widget: string }
                  - { label: Heading, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Calculate Button, name: button, widget: string }
                  - { label: Disclaimer, name: disclaimer, widget: text }
              - label: Closing Banner
                name: manifesto
                widget: object
                fields:
                  - { label: Kicker, name: kicker, widget: string }
                  - { label: Headline Line 1, name: lineOne, widget: string }
                  - { label: Headline Line 2, name: lineTwo, widget: string }
                  - { label: Headline Line 3, name: lineThree, widget: string }
                  - { label: Button Text, name: button, widget: string }
              - label: Footer
                name: footer
                widget: object
                fields:
                  - { label: Tagline, name: tagline, widget: string }
                  - { label: Responsible Play Note, name: responsibleNote, widget: string }
          - label: Column Series
            name: columnSeries
            widget: object
            fields:
              - label: JK Sportsline
                name: jkSportsline
                widget: object
                fields:
                  - { label: Display Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
              - label: The Becker Report
                name: beckerReport
                widget: object
                fields:
                  - { label: Display Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
