backend:
  name: turbo-github
  turbo_site_id: 2d4deb2d-caff-4ae8-8e09-1173ad4156a0
  branch: main

media_folder: "assets/uploads"
public_folder: "/jksportsbook/assets/uploads"
site_url: "https://blacksheepbetting.github.io/jksportsbook/"
display_url: "https://blacksheepbetting.github.io/jksportsbook/"
logo_url: "/jksportsbook/assets/favicon.svg"

collections:
  - name: publishing
    label: Publishing Desk
    files:
      - file: content/editor.json
        name: editor
        label: Homepage & Publishing
        format: json
        fields:
          - label: Best Bets Ticker
            name: bestBets
            widget: list
            summary: "{{fields.poster}} — {{fields.selection}} ({{fields.odds}})"
            fields:
              - { label: Poster, name: poster, widget: string }
              - { label: Selection, name: selection, widget: string }
              - { label: American Odds, name: odds, widget: number, value_type: int }
          - label: Site Copy
            name: siteCopy
            widget: object
            fields:
              - label: Masthead
                name: masthead
                widget: object
                fields:
                  - { label: Top Strapline, name: strapline, widget: string }
                  - { label: Network Label, name: network, widget: string }
                  - { label: Brand Tagline, name: brandTagline, widget: string }
              - label: Opening Banner
                name: opening
                widget: object
                fields:
                  - { label: Banner Label, name: label, widget: string }
                  - { label: Banner Message, name: message, widget: text }
                  - { label: Edition Label, name: edition, widget: string }
                  - { label: Daily Label, name: dailyLabel, widget: string }
                  - { label: Daily Tagline, name: dailyTagline, widget: string }
              - label: Navigation
                name: navigation
                widget: object
                fields:
                  - { label: Latest Tab, name: latest, widget: string }
                  - { label: Columns Tab, name: columns, widget: string }
                  - { label: All Columns Link, name: allColumns, widget: string }
                  - { label: JK Sportsline Link, name: jkSportsline, widget: string }
                  - { label: Becker Report Link, name: beckerReport, widget: string }
                  - { label: Shows Tab, name: shows, widget: string }
                  - { label: Betting Tab, name: betting, widget: string }
                  - { label: Betting Desk Link, name: bettingDesk, widget: string }
                  - { label: Best Bets Link, name: bestBets, widget: string }
                  - { label: Game of the Week Link, name: gameOfWeek, widget: string }
                  - { label: NFL / CFB Futures Link, name: futures, widget: string }
                  - { label: All Sports Filter, name: allSports, widget: string }
                  - { label: NFL Filter, name: nfl, widget: string }
                  - { label: NBA Filter, name: nba, widget: string }
                  - { label: College Filter, name: college, widget: string }
                  - { label: MLB Filter, name: mlb, widget: string }
                  - { label: FPHL Filter, name: fphl, widget: string }
                  - { label: Schedule Link, name: schedule, widget: string }
                  - { label: Odds Calculator Link, name: calculator, widget: string }
                  - { label: Tune In Button, name: tuneIn, widget: string }
                  - { label: Ticker Label, name: tickerLabel, widget: string }
                  - { label: Ticker Link, name: tickerLink, widget: string }
              - label: Homepage Sections
                name: home
                widget: object
                fields:
                  - { label: Hero Eyebrow, name: heroEyebrow, widget: string }
                  - { label: Hero Headline Line 1, name: heroTitleLine1, widget: string }
                  - { label: Hero Headline Line 2, name: heroTitleLine2, widget: string }
                  - { label: Hero Description, name: heroDescription, widget: text }
                  - { label: Hero Link Text, name: heroLink, widget: string }
                  - { label: Radar Heading, name: radarTitle, widget: string }
                  - { label: All Stories Link, name: allStoriesLink, widget: string }
                  - { label: Latest Filter Label, name: previewLabel, widget: string }
                  - { label: Newsroom Kicker, name: newsroomKicker, widget: string }
                  - { label: Newsroom Heading, name: newsroomTitle, widget: string }
                  - { label: Newsroom Aside, name: newsroomAside, widget: string }
                  - { label: Columns Kicker, name: columnsKicker, widget: string }
                  - { label: Columns Heading, name: columnsTitle, widget: string }
                  - { label: Columns Aside, name: columnsAside, widget: string }
                  - { label: Series Kicker, name: seriesKicker, widget: string }
                  - { label: Series Prompt, name: seriesAside, widget: string }
              - label: Shows
                name: shows
                widget: object
                fields:
                  - { label: Section Label, name: kicker, widget: string }
                  - { label: Heading Line 1, name: titleLine1, widget: string }
                  - { label: Heading Line 2, name: titleLine2, widget: string }
                  - { label: Description, name: description, widget: text }
              - label: Betting Sections
                name: betting
                widget: object
                fields:
                  - { label: Section Label, name: kicker, widget: string }
                  - { label: Betting Desk Heading, name: title, widget: string }
                  - { label: Betting Desk Aside, name: aside, widget: string }
                  - { label: Betting Desk Description, name: description, widget: text }
                  - { label: Best Bets Label, name: bestBetsKicker, widget: string }
                  - { label: Best Bets Heading, name: bestBetsTitle, widget: string }
                  - { label: Game of the Week Label, name: gameKicker, widget: string }
                  - { label: Game of the Week Heading, name: gameTitle, widget: string }
                  - { label: Game of the Week Description, name: gameDescription, widget: text }
                  - { label: Futures Label, name: futuresKicker, widget: string }
                  - { label: Futures Heading, name: futuresTitle, widget: string }
                  - { label: Futures Description, name: futuresDescription, widget: text }
              - label: Odds Calculator
                name: calculator
                widget: object
                fields:
                  - { label: Section Label, name: kicker, widget: string }
                  - { label: Heading, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Calculate Button, name: button, widget: string }
                  - { label: Disclaimer, name: disclaimer, widget: text }
              - label: Closing Banner
                name: manifesto
                widget: object
                fields:
                  - { label: Kicker, name: kicker, widget: string }
                  - { label: Headline Line 1, name: lineOne, widget: string }
                  - { label: Headline Line 2, name: lineTwo, widget: string }
                  - { label: Headline Line 3, name: lineThree, widget: string }
                  - { label: Button Text, name: button, widget: string }
              - label: Results Section
                name: results
                widget: object
                fields:
                  - { label: Section Label, name: kicker, widget: string }
                  - { label: Heading, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Footnote, name: footnote, widget: text }
              - label: Footer
                name: footer
                widget: object
                fields:
                  - { label: Tagline, name: tagline, widget: string }
                  - { label: Responsible Play Note, name: responsibleNote, widget: string }
          - label: Column Series
            name: columnSeries
            widget: object
            fields:
              - label: JK Sportsline
                name: jkSportsline
                widget: object
                fields:
                  - { label: Display Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
              - label: The Becker Report
                name: beckerReport
                widget: object
                fields:
                  - { label: Display Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
          - label: Podcast
            name: podcast
            widget: object
            fields:
              - { label: Show Title, name: title, widget: string }
              - { label: Spotify URL, name: spotifyUrl, widget: string, required: false }
              - { label: Apple Podcasts URL, name: appleUrl, widget: string, required: false }
              - { label: YouTube Channel or Episode URL, name: youtubeUrl, widget: string, required: false }
              - label: Episodes
                name: episodes
                widget: list
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Label, name: number, widget: string }
                  - { label: Duration, name: duration, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: YouTube Embed URL, name: videoUrl, widget: string, required: false }
                  - { label: Thumbnail URL, name: thumbnailUrl, widget: string, required: false }
                  - { label: Listen URL, name: listenUrl, widget: string }
          - label: Radar Story Overrides
            name: storyOverrides
            widget: list
            summary: "{{fields.id}} — {{fields.title}}"
            fields:
              - { label: Story ID, name: id, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Deck, name: deck, widget: text }
              - { label: Author, name: author, widget: string }
              - { label: Read Time, name: readTime, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Body HTML, name: body, widget: markdown }
          - label: New Stories
            name: newStories
            widget: list
            summary: "{{fields.sport}} — {{fields.title}}"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Sport, name: sport, widget: select, options: [NFL, NBA, College, MLB, FPHL, All] }
              - { label: Category, name: category, widget: string }
              - { label: Column Series, name: series, widget: select, options: [{ label: General Columns, value: "" }, { label: JK Sportsline, value: "jk-sportsline" }, { label: The Becker Report, value: "becker-report" }], required: false }
              - { label: Betting Desk Section, name: deskSection, widget: select, options: [{ label: Not a betting feature, value: "" }, { label: Game of the Week, value: "game-of-week" }, { label: NFL / CFB Futures, value: "futures" }], required: false }
              - { label: Type, name: type, widget: select, options: [story, column], default: story }
              - { label: Art Style, name: art, widget: select, options: [stadium, court, baseball, playbook], default: playbook }
              - { label: Art Label, name: artLabel, widget: string, required: false }
              - { label: Deck, name: deck, widget: text }
              - { label: Author, name: author, widget: string }
              - { label: Read Time, name: readTime, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Body HTML, name: body, widget: markdown }
          - label: Official Picks
            name: picks
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Sport, name: sport, widget: string }
              - { label: Type, name: type, widget: string }
              - { label: Matchup, name: matchup, widget: string }
              - { label: Selection, name: selection, widget: string }
              - { label: American Odds, name: odds, widget: number, value_type: int }
              - { label: Units, name: units, widget: number, value_type: float }
              - { label: Posted At, name: postedAt, widget: string, required: false }
              - { label: Analysis, name: body, widget: text }
          - label: Results Ledger
            name: results
            widget: list
            fields:
              - { label: Sport, name: sport, widget: string }
              - { label: Type, name: type, widget: string }
              - { label: Selection, name: selection, widget: string }
              - { label: American Odds, name: odds, widget: number, value_type: int }
              - { label: Units, name: units, widget: number, value_type: float }
              - { label: Result, name: result, widget: select, options: [Win, Loss, Push] }
